# /etc/nginx/sites-available/portfolio
server {
    listen 80;
    server_name smokingmirror.quest www.smokingmirror.quest;
    # Redirect all HTTP to HTTPS
    return 301 https://smokingmirror.quest$request_uri;
}

server {
    listen 443 ssl http2;
    server_name smokingmirror.quest;

    # SSL certs will be installed by Certbot
    ssl_certificate /etc/letsencrypt/live/smokingmirror.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smokingmirror.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard {
        proxy_pass http://127.0.0.1:8000/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /automation {
        proxy_pass http://127.0.0.1:8000/automation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www to root on HTTPS as well (after certs are installed)
server {
    listen 443 ssl http2;
    server_name www.smokingmirror.quest;

    ssl_certificate /etc/letsencrypt/live/smokingmirror.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smokingmirror.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://smokingmirror.quest$request_uri;
}